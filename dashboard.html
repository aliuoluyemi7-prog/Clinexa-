<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Clinexa — Dashboard</title>
<link rel="icon" href="favicon.ico">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#12213D;
    --ink-soft:#4A5A78;
    --blue:#2954E5;
    --blue-deep:#1B3AB0;
    --teal:#0EA5A0;
    --amber:#E8871E;
    --bg:#F5F7FB;
    --card:#FFFFFF;
    --line:#E3E8F2;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Manrope',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.num{
    font-family:'Space Grotesk',sans-serif;
    letter-spacing:-0.01em;
  }

  /* Header with pulse signature */
  header{
    background:linear-gradient(180deg,var(--blue-deep) 0%, var(--blue) 100%);
    color:#fff;
    padding:22px 18px 34px;
    position:relative;
    overflow:hidden;
  }
  .pulse-line{
    position:absolute;
    bottom:0; left:0; right:0;
    height:26px;
    opacity:0.35;
  }
  .top-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:18px;
  }
  .brand .dot{
    width:9px;height:9px;border-radius:50%;
    background:var(--teal);
    box-shadow:0 0 0 4px rgba(14,165,160,0.25);
  }
  .clinic-name{
    font-size:22px;
    font-weight:600;
    margin-top:14px;
  }
  .clinic-sub{
    font-size:13px;
    opacity:0.8;
    margin-top:2px;
  }
  .signout{
    background:rgba(255,255,255,0.14);
    border:1px solid rgba(255,255,255,0.25);
    color:#fff;
    font-size:12px;
    font-weight:600;
    padding:7px 12px;
    border-radius:20px;
    cursor:pointer;
  }

  main{
    padding:0 16px 90px;
    margin-top:-22px;
  }

  /* Stat strip */
  .stats{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-bottom:20px;
  }
  .stat-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 14px 12px;
    box-shadow:0 6px 16px rgba(18,33,61,0.05);
  }
  .stat-label{
    font-size:11.5px;
    color:var(--ink-soft);
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.04em;
  }
  .stat-num{
    font-size:26px;
    font-weight:700;
    margin-top:4px;
  }
  .stat-num.attn{ color:var(--amber); }
  .stat-num.ok{ color:var(--teal); }

  section h2{
    font-size:15px;
    font-weight:600;
    color:var(--ink);
    margin:22px 2px 10px;
  }

  /* Department grid */
  .dept-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }
  .dept-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px;
    text-decoration:none;
    color:var(--ink);
    display:block;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .dept-card:active{
    transform:scale(0.98);
  }
  .dept-name{
    font-weight:700;
    font-size:14.5px;
  }
  .dept-meta{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:4px;
  }
  .dept-meta.attn{ color:var(--amber); font-weight:600; }

  /* Empty state */
  .empty{
    background:var(--card);
    border:1px dashed var(--line);
    border-radius:var(--radius);
    padding:22px 16px;
    text-align:center;
    color:var(--ink-soft);
    font-size:13.5px;
  }

  footer{
    position:fixed;
    bottom:0; left:0; right:0;
    background:#fff;
    border-top:1px solid var(--line);
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    font-size:11.5px;
    color:var(--ink-soft);
    text-align:center;
  }

  @media(min-width:640px){
    .stats{grid-template-columns:repeat(4,1fr);}
    .dept-grid{grid-template-columns:repeat(4,1fr);}
    main{max-width:900px;margin-left:auto;margin-right:auto;margin-top:-22px;}
  }
</style>
</head>
<body>

<header>
  <div class="top-row">
    <div class="brand"><span class="dot"></span>Clinexa</div>
    <button class="signout" id="signOutBtn">Sign out</button>
  </div>
  <div class="clinic-name" id="clinicName">Loading clinic…</div>
  <div class="clinic-sub" id="todayDate"></div>

  <svg class="pulse-line" viewBox="0 0 400 26" preserveAspectRatio="none">
    <polyline points="0,13 60,13 75,4 90,22 105,13 400,13"
      fill="none" stroke="#ffffff" stroke-width="2" />
  </svg>
</header>

<main>
  <div class="stats">
    <div class="stat-card">
      <div class="stat-label">In clinic now</div>
      <div class="stat-num" id="statInHouse">–</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Registered patients</div>
      <div class="stat-num" id="statPatients">–</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Active staff</div>
      <div class="stat-num" id="statStaff">–</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Needs attention</div>
      <div class="stat-num attn" id="statAttention">–</div>
    </div>
  </div>

  <section>
    <h2>Enter a department</h2>
    <div class="dept-grid" id="deptGrid">
      <!-- populated by JS -->
    </div>
  </section>

  <section>
    <h2>Quick access</h2>
    <div class="dept-grid">
      <a class="dept-card" href="staff.html">
        <div class="dept-name">Staff</div>
        <div class="dept-meta">Manage clinic team</div>
      </a>
      <a class="dept-card" href="attendance.html">
        <div class="dept-name">Attendance</div>
        <div class="dept-meta">Today's check-ins</div>
      </a>
      <a class="dept-card" href="payroll.html">
        <div class="dept-name">Payroll</div>
        <div class="dept-meta">Run this month's pay</div>
      </a>
      <a class="dept-card" href="payslip.html">
        <div class="dept-name">Payslips</div>
        <div class="dept-meta">View & download</div>
      </a>
    </div>
  </section>
</main>

<footer>Clinexa — clinic operations, in one place</footer>

<script>
  // ---- Supabase setup ----
  // TODO: replace with your real project URL + anon key (same as login.html)
  const SUPABASE_URL = "YOUR_SUPABASE_URL";
  const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const clinicNameEl = document.getElementById('clinicName');
  const todayDateEl = document.getElementById('todayDate');
  const deptGrid = document.getElementById('deptGrid');

  todayDateEl.textContent = new Date().toLocaleDateString('en-GB', {
    weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
  });

  // Departments — swap counts for real Supabase queries once schema is wired
  const departments = [
    { name: "Front Desk / Records", staff: 2 },
    { name: "Laboratory", staff: 1 },
    { name: "Nursing", staff: 2 },
    { name: "Pharmacy", staff: 1 },
    { name: "Wards", staff: 0, attention: true },
    { name: "Outpatient / Clinician", staff: 2 },
  ];

  function renderDepartments(list) {
    deptGrid.innerHTML = list.map(d => `
      <a class="dept-card" href="dashboard.html">
        <div class="dept-name">${d.name}</div>
        <div class="dept-meta ${d.attention ? 'attn' : ''}">
          ${d.attention ? 'Needs attention' : `${d.staff} staff on duty`}
        </div>
      </a>
    `).join('');
  }

  async function loadDashboard() {
    const { data: { session } } = await supabase.auth.getSession();

    if (!session) {
      window.location.href = "login.html";
      return;
    }

    // Clinic name — falls back gracefully if not set yet in user metadata
    const clinicName = session.user.user_metadata?.clinic_name || "Your Clinic";
    clinicNameEl.textContent = clinicName;

    // TODO: replace static numbers with real Supabase table counts
    document.getElementById('statInHouse').textContent = "—";
    document.getElementById('statPatients').textContent = "—";
    document.getElementById('statStaff').textContent = departments.reduce((a,d)=>a+d.staff,0);
    document.getElementById('statAttention').textContent =
      departments.filter(d => d.attention).length;

    renderDepartments(departments);
  }

  document.getElementById('signOutBtn').addEventListener('click', async () => {
    await supabase.auth.signOut();
    window.location.href = "login.html";
  });

  loadDashboard();
</script>

</body>
</html>
